:root{
  --bg:#FFFFFF; --soft:#F4F5F8; --fill:#E9EBF0; --sep:#E4E6EC; --ink:#161A26; --ink2:#687083; --ink3:#A9AFBD;
  --red:#F0413A; --blue:#2F6FEB; --green:#1DB45A; --yellow:#FFC21A; --purple:#8B5CF6; --orange:#FF7A1A;
  --slate:#5B6477;
  --l1:#1DB45A; --l2:#2F6FEB; --l3:#F5A300; --l4:#FF6A1A; --l5:#8B5CF6; --l6:#E0115F;
  --font:"Rubik",-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (display-mode: fullscreen){:root{--st:max(env(safe-area-inset-top,0px),34px)}}
html:fullscreen{--st:max(env(safe-area-inset-top,0px),34px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 calc(110px + var(--sb))}
.app{max-width:540px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:3px solid rgba(47,111,235,.45);outline-offset:2px}
h1,h2,h3,p{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* logo: four cards in an arch */
.logo{display:flex;align-items:flex-end;padding-top:3px}
.logo i{width:13px;height:19px;border-radius:3px;border:2px solid #fff;margin-left:-5px;box-shadow:0 1px 2px rgba(0,0,0,.22)}
.logo i:nth-child(1){margin-left:0;transform:translateY(2px) rotate(-15deg)}
.logo i:nth-child(2){transform:translateY(-.5px) rotate(-5deg)}
.logo i:nth-child(3){transform:translateY(-.5px) rotate(5deg)}
.logo i:nth-child(4){transform:translateY(2px) rotate(15deg)}
.logo.big i{width:44px;height:64px;border-radius:9px;border-width:4px;margin-left:-16px;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
.logo.big i:nth-child(1){margin-left:0;transform:translateY(7px) rotate(-15deg)}
.logo.big i:nth-child(2){transform:translateY(-1px) rotate(-5deg)}
.logo.big i:nth-child(3){transform:translateY(-1px) rotate(5deg)}
.logo.big i:nth-child(4){transform:translateY(7px) rotate(15deg)}

/* top bar */
.top{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 16px 10px;margin-inline:-16px}
.top .title{flex:1;min-width:0;display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn svg{width:20px;height:20px}
.pchip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--soft);font-weight:700;font-size:13px;color:var(--ink2);flex:none}
.pchip .stack{display:flex}
.pchip .stack span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;border:2px solid var(--soft);margin-left:-9px}
.pchip .stack span:first-child{margin-left:0}

.section{margin-top:18px}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 2px 8px;display:flex;justify-content:space-between;gap:8px}
.lab b{color:var(--ink2);font-weight:600;letter-spacing:0;text-transform:none;font-size:12.5px}
.h2{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:6px}
.sub{color:var(--ink2);font-size:15px;margin-top:4px}

/* home */
.hero{display:grid;justify-items:center;text-align:center;gap:14px;padding:26px 0 8px}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--ink2);font-size:16px}
.big-btn{width:100%;padding:20px;border-radius:22px;background:var(--ink);color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 14px 30px -16px rgba(22,26,38,.8)}
.big-btn:active{transform:scale(.985)}
.cont{width:100%;text-align:left;border-radius:22px;padding:16px;background:linear-gradient(135deg,#EEF3FF,#F6EEFF);display:grid;gap:10px}
.cont b{font-size:18px;font-weight:800}
.cont small{color:var(--ink2);font-size:13.5px;font-weight:600}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:3px 10px 3px 3px;font-weight:700;font-size:13px}
.mini span i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow button{flex:1;padding:14px;border-radius:18px;background:var(--soft);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.linkrow svg{width:18px;height:18px}

/* mode cards */
.modes{display:grid;gap:10px}
.mcard{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;border-radius:22px;padding:16px;background:#fff;box-shadow:0 1px 3px rgba(20,24,40,.08),0 0 0 1px var(--sep)}
.mcard:active{transform:scale(.99)}
.mcard b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.mcard small{display:block;color:var(--ink2);font-size:13.5px;font-weight:500;margin-top:2px}
.mcard .dotsrow{grid-column:1 / 3;display:flex;gap:4px;align-items:flex-end;height:26px}
.mcard .dotsrow i{flex:1;border-radius:3px;min-height:4px}
.mcard .cnt{font-weight:800;font-size:13px;color:var(--ink2);background:var(--soft);padding:5px 10px;border-radius:99px}
.mcard.rand{background:linear-gradient(135deg,#FFF4E5,#FFE9F2 50%,#ECE9FF)}
.mcard.rand .cnt{background:#fff}

/* sliders */
.box{background:var(--soft);border-radius:22px;padding:14px 16px}
.row2{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bignum{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:14px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-left:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:4px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--track,var(--fill))}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--track,var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.dual{position:relative;height:40px;margin-top:6px}
.dual .trk{position:absolute;left:15px;right:15px;top:15px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--l1),var(--l2) 30%,var(--l3) 50%,var(--l4) 68%,var(--l5) 84%,var(--l6));}
.dual .trk::before,.dual .trk::after{content:"";position:absolute;top:0;bottom:0;background:var(--fill)}
.dual .trk::before{left:0;width:var(--a,0%);border-radius:5px 0 0 5px}
.dual .trk::after{right:0;width:calc(100% - var(--b,100%));border-radius:0 5px 5px 0}
.dual input{position:absolute;inset:0;margin:0;height:40px;pointer-events:none}
.dual input::-webkit-slider-runnable-track{background:transparent}
.dual input::-moz-range-track{background:transparent}
.dual input::-webkit-slider-thumb{pointer-events:auto}
.dual input::-moz-range-thumb{pointer-events:auto}
.rng3{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline}
.rng3 .to{font-weight:800;color:var(--ink3);font-size:16px}
#hiV{text-align:right}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.presets button{padding:8px 12px;border-radius:99px;background:#fff;font-weight:700;font-size:13.5px;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--fill)}
.presets button[aria-pressed="true"]{background:var(--pc);color:#fff;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:99px;background:var(--soft);font-weight:600;font-size:14px;color:var(--ink3)}
.chip .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:#fff;font-size:11px;font-weight:800}
.chip[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--cc)}
.chip[aria-pressed="true"] .ic{background:var(--cc)}

/* bottom action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 16px calc(12px + var(--sb));background:linear-gradient(rgba(255,255,255,0),#fff 32%)}
.actionbar .in{max-width:540px;margin:0 auto;display:flex;gap:8px}
.go{flex:1;padding:17px;border-radius:18px;background:var(--blue);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 26px -12px var(--blue)}
.go.dark{background:var(--ink);box-shadow:0 12px 26px -14px rgba(22,26,38,.8)}
.go.soft{flex:none;background:var(--soft);color:var(--ink);box-shadow:none;padding:17px 20px;font-size:20px}
.go:active{transform:scale(.985)}
.go:disabled{opacity:.35}
.btn{flex:1;padding:15px;border-radius:16px;background:var(--soft);color:var(--ink);font-size:16px;font-weight:700}
.btn.pri{background:var(--blue);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.35}
.btnrow{display:flex;gap:8px;margin-top:12px}

/* curve */
.curve{background:var(--soft);border-radius:20px;padding:12px 14px 8px}
.curve svg{display:block;width:100%;height:auto}

/* difficulty meter */
.dm{display:flex;align-items:center;gap:8px;min-width:0}
.dm .t{flex:1;min-width:48px;height:8px;border-radius:4px;background:var(--fill);overflow:hidden;position:relative}
.dm .t i{position:absolute;inset:0 auto 0 0;width:var(--v);border-radius:4px;background:linear-gradient(90deg,var(--l1),var(--lc))}
.dm b{font-weight:800;font-size:14px;color:var(--lc);font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.dm span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lc);white-space:nowrap}

const allowed=p=>(C().allowSkip||!p.skip)&&(C().allowPure||!p.nw)&&(C().allowColour||!p.colour)&&(C().allowMath||!p.math);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const $$=id=>document.getElementById(id);

/* ---------- generator ----------
   Each slot aims at a point between the easiest and hardest difficulty chosen.
   Randomness adds noise to those targets and to the final order: 0 = always harder, 100 = anything goes. */
function generate(){
  const {count:N,lo,hi,chaos}=C(),ch=chaos/100,pool=LIB.filter(allowed),picked=[],fam={};let mods=0;
  const modCap=Math.max(1,Math.round(N*(hi>85?.35:.2)));
  for(let i=0;i<N;i++){
    const x=N===1?.5:i/(N-1);let target=lo+(hi-lo)*x+gauss()*ch*16;target=Math.max(lo-4,Math.min(hi+2,target));
    const prev=picked[picked.length-1];let best=null,bs=1e9;
    for(const p of pool){if(picked.includes(p))continue;
      let s=Math.abs(p.h-target)*1.6+Math.random()*8;
      if(prev&&prev.fam===p.fam)s+=14;s+=(fam[p.fam]||0)*7;
      if((p.skip||p.nw)&&mods>=modCap)s+=25;
      if(s<bs){bs=s;best=p;}}
    if(!best)break;picked.push(best);fam[best.fam]=(fam[best.fam]||0)+1;if(best.skip||best.nw)mods++;
  }
  const key=new Map(picked.map(p=>[p,p.h+gauss()*ch*(hi-lo)*.35]));
  picked.sort((a,b)=>key.get(a)-key.get(b));
  S.list=picked.map(p=>p.code);S.listName="Random";S.mode="random";save();
}
function reroll(i){
  const cur=BY[S.list[i]];
  const near=LIB.filter(p=>allowed(p)&&!S.list.includes(p.code)).map(p=>[Math.abs(p.h-cur.h)+(p.fam===cur.fam?5:0)+Math.random()*4,p]).sort((a,b)=>a[0]-b[0]).slice(0,6);
  if(!near.length)return;const pick=near[Math.floor(Math.random()*near.length)][1];
  S.list[i]=pick.code;save();render();toast(pick.name);
}

const fillTrack=v=>`linear-gradient(90deg,var(--blue) ${v}%,var(--fill) ${v}%)`;

function curveSVG(list){
  const W=340,H=64,n=list.length,x=i=>n===1?W/2:10+(W-20)*i/(n-1),y=h=>H-8-(H-16)*(h/100);
  const pts=list.map((c,i)=>[x(i),y(BY[c].h),BY[c].h]);
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="var(--fill)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${n>20?3.5:5}" fill="${lc(p[2])}" stroke="#fff" stroke-width="2"/>`).join("")}</svg>`;
}
function vPreview(){
  const list=S.list.map(c=>BY[c]),hs=list.map(p=>p.h);
  return `<div class="section"><div class="lab"><span>${list.length} phases</span><b>Difficulty ${Math.min(...hs)} → ${Math.max(...hs)}</b></div><div class="curve">${curveSVG(S.list)}</div></div>
  <div class="section list">${list.map((p,i)=>`
    <div class="ph" style="--lc:${lc(p.h)};animation-delay:${Math.min(i,12)*22}ms">
      <div class="ph-top"><div class="num">${i+1}</div><div class="ph-name"><b>${esc(p.name)}</b>${dm(p.h)}</div>
      <button class="re" data-re="${i}" aria-label="Swap ${esc(p.name)}">${IC.re}</button></div>
      ${nojBanner(p)}${meldsHTML(p,"L"+i)}${badges(p,true)}
    </div>`).join("")}</div>`;
}
const starterOf=g=>(g.startOffset+g.rounds.length)%g.players.length;
function vGame(){
  const g=S.game;
  const N=g.list.length,lead=[...g.players.keys()].sort((a,b)=>g.players[b].phase-g.players[a].phase||g.players[a].points-g.players[b].points)[0];
  const st=starterOf(g),sp=g.players[st];
  return `${g.winner!=null?`<div class="win" style="--pc:${PC[g.winner%8]}"><small>Winner</small><h2>${esc(g.players[g.winner].name)}</h2><p>All ${N} phases · ${g.players[g.winner].points} points</p></div>`:""}
  ${g.winner==null?`<div class="turnbar" style="--tc:${PC[st%8]}"><div class="av" style="--pc:${PC[st%8]}">${ini(sp.name)}</div><div class="who"><small>Round ${g.rounds.length+1} · starts</small><b>${esc(sp.name)}</b></div></div>`:""}
  ${g.players.length<=4?`<button class="tablebtn" id="tableBtn"><svg viewBox="0 0 32 32" fill="none"><rect x="7" y="2" width="18" height="28" rx="4" fill="#fff" stroke="#161A26" stroke-width="2"/><rect x="10" y="5" width="12" height="10" rx="2" fill="${PC[1]}"/><rect x="10" y="17" width="12" height="10" rx="2" fill="${PC[0]}"/></svg><span>Table mode<small>Phone in the middle, each side faces its player</small></span></button>`:""}
  <div class="players">${g.players.map((p,i)=>{const done=p.phase>=N,ph=done?null:BY[g.list[p.phase]],isS=i===st&&g.winner==null;
    return `<div class="pl ${isS?"starts":""}" style="--pc:${PC[i%8]}">${isS?`<span class="startpill">Starts</span>`:""}
      <div class="pl-top"><div class="av">${ini(p.name)}</div><div class="pl-name">${esc(p.name)} ${i===lead&&g.rounds.length?`<span class="crown">♛</span>`:""}<small>Phase ${Math.min(p.phase+1,N)} / ${N}</small></div><div class="pts"><b>${p.points}</b><small>pts</small></div></div>
      <div class="prog">${g.list.map((_,k)=>`<i class="${k<p.phase?"done":k===p.phase?"now":""}"></i>`).join("")}</div>
      ${done?`<b>All phases done</b>`:`<div class="cur"><div class="hd"><b>${esc(ph.name)}</b>${dm(ph.h)}</div>${nojBanner(ph)}${meldsHTML(ph,`P${i}R${g.rounds.length}`)}${badges(ph,true)}</div>`}
    </div>`}).join("")}</div>
  ${g.rounds.length?`<div class="hist"><table><thead><tr><th>#</th>${g.players.map(p=>`<th>${esc(p.name)}</th>`).join("")}</tr></thead><tbody>
   ${g.rounds.map((r,k)=>`<tr><td>${k+1}</td>${r.map(e=>`<td class="${e.made?"ok":""}">${e.made?"✓ ":""}+${e.pts}</td>`).join("")}</tr>`).reverse().join("")}</tbody></table></div>`:""}
  <div class="btnrow"><button class="btn danger" id="endGame">End game</button></div>`;
}
function actionsHTML(){
  if(S.screen==="custom")return `<button class="go dark" id="genBtn">${IC.dice} Generate phases</button>`;
  if(S.screen==="preview")return `${S.mode==="random"?`<button class="go soft" id="shuffleBtn" aria-label="Generate again">${IC.dice}</button>`:""}<button class="go" id="startBtn">${IC.play} Start game</button>`;
  if(S.screen==="game")return `<button class="go soft" id="undo" ${S.game.rounds.length?"":"disabled"} aria-label="Undo last round">↶</button><button class="go" id="endRound" ${S.game.winner!=null?"disabled":""}>End round</button>`;
  return "";
}

function render(){
  if(S.screen==="game"&&!S.game)S.screen="home";
  $$("top").innerHTML=topHTML();
  const v=$$("view");
  v.innerHTML={home:vHome,mode:vMode,custom:vCustom,preview:vPreview,game:vGame}[S.screen]();
  const a=actionsHTML();$$("actionsIn").innerHTML=a;$$("actions").hidden=!a;
  $$("backBtn")&&($$("backBtn").onclick=goBack);
  $$("playersBtn").onclick=()=>openPlayers();
  $$("helpBtn").onclick=openHelp;
  const fsb=$$("fsBtn");
  if(fsb&&document.fullscreenEnabled&&!matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches){fsb.hidden=false;
    fsb.onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast("Full screen isn't allowed here"));};}
  if(S.screen==="home"){
    $$("newBtn").onclick=()=>go("mode");
    $$("contBtn")&&($$("contBtn").onclick=()=>go("game"));
    $$("guideBtn").onclick=openHelp;$$("plBtn2").onclick=()=>openPlayers();
  }else if(S.screen==="mode"){
    v.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{const k=b.dataset.preset;S.list=PRESETS[k].list.slice();S.listName=PRESETS[k].name;S.mode=k;go("preview");});
    $$("randBtn").onclick=()=>go("custom");
  }else if(S.screen==="custom"){
    const c=C(),cnt=$$("cnt"),lo=$$("lo"),hi=$$("hi"),chaos=$$("chaos");
    cnt.oninput=()=>{c.count=+cnt.value;$$("cntV").firstChild.textContent=c.count;$$("cntV").lastChild.textContent=c.count===1?"phase":"phases";cnt.style.setProperty("--track",fillTrack((c.count-1)/29*100));};
    const upd=src=>{let x=+lo.value,y=+hi.value;if(y-x<5){if(src==="lo")x=Math.max(0,y-5);else y=Math.min(100,x+5);if(y-x<5){x=Math.max(0,y-5);}}
      lo.value=x;hi.value=y;c.lo=x;c.hi=y;
      const d=$$("dual").firstElementChild;d.style.setProperty("--a",x+"%");d.style.setProperty("--b",y+"%");
      $$("loV").textContent=x;$$("loV").style.color=lc(x);$$("hiV").textContent=y;$$("hiV").style.color=lc(y);$$("rngLbl").textContent=`${LVL[level(x)]} to ${LVL[level(y)]}`;
      v.querySelectorAll("[data-range]").forEach(b=>{const[,ra,rb]=RANGES[b.dataset.range];b.setAttribute("aria-pressed",ra===x&&rb===y);});};
    lo.oninput=()=>upd("lo");hi.oninput=()=>upd("hi");upd();
    chaos.oninput=()=>{c.chaos=+chaos.value;chaos.style.setProperty("--track",fillTrack(c.chaos));$$("chaosLbl").textContent=chaosName(c.chaos);};
    [cnt,lo,hi,chaos].forEach(x=>x.onchange=save);
    v.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{const[,ra,rb]=RANGES[b.dataset.range];lo.value=ra;hi.value=rb;upd();save();});
    [["tColour","allowColour"],["tMath","allowMath"],["tSkip","allowSkip"],["tPure","allowPure"]].forEach(([id,k])=>$$(id).onclick=()=>{c[k]=!c[k];save();$$(id).setAttribute("aria-pressed",c[k]);});
    $$("genBtn").onclick=()=>{generate();go("preview");toast(S.list.length===1?"1 fresh phase":`${S.list.length} fresh phases`);};
  }else if(S.screen==="preview"){
    v.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>reroll(+b.dataset.re));
    $$("shuffleBtn")&&($$("shuffleBtn").onclick=()=>{generate();render();scrollTo(0,0);toast("New phases");});
    $$("startBtn").onclick=()=>{if(S.game&&S.game.winner==null&&S.game.rounds.length){confirmStart();return;}openPlayers(true);};
  }else if(S.screen==="game"){
    const g=S.game;
    $$("tableBtn")&&($$("tableBtn").onclick=()=>{S.table=true;save();renderTable();});
    $$("endRound").onclick=openRound;
    $$("undo").onclick=()=>{if(!g.rounds.length)return;g.rounds.pop();recompute(g);save();render();toast("Round undone");};
    const eg=$$("endGame");eg.onclick=()=>{if(eg.dataset.sure){S.game=null;save();go("home");toast("Game ended");}else{eg.dataset.sure=1;eg.textContent="Tap again to end the game";}};
  }
}
function goBack(){go(S.screen==="preview"?(S.mode==="random"?"custom":"mode"):S.screen==="custom"?"mode":"home");}
function go(scr){S.screen=scr;save();render();scrollTo(0,0);}
function confirmStart(){
  sheetIn.innerHTML=`<div class="grab"></div><h2>Start a new game?</h2><p class="note">Your current game (round ${S.game.rounds.length+1}) will be replaced.</p>
   <div class="btnrow"><button class="btn" id="cancel">Keep playing</button><button class="btn pri" id="ok">New game</button></div>`;
  $$("cancel").onclick=()=>{closeSheet();go("game");};$$("ok").onclick=()=>{closeSheet();openPlayers(true);};sheet.hidden=false;

function startGame(){
  const names=S.players.map((n,i)=>String(n).trim()||`Player ${i+1}`),st=Math.min(S.starter||0,names.length-1);
  S.game={list:S.list.slice(),name:S.listName,players:names.map(name=>({name,phase:0,points:0})),rounds:[],winner:null,startOffset:st};

/* ---------- players sheet ---------- */
function openPlayers(startAfter){
  const inGame=S.screen==="game"&&S.game&&!startAfter;
  const draw=()=>{
    const names=inGame?S.game.players.map(p=>p.name):S.players,st=inGame?starterOf(S.game):Math.min(S.starter||0,names.length-1);
    sheetIn.innerHTML=`<div class="grab"></div><h2>${startAfter?"Who's playing?":"Players"}</h2>${inGame?`<p class="note">Rename players here. To add or remove players, start a new game.</p>`:`<p class="note">Seat order goes clockwise. Table mode works for 2–4 players, with Player 1 at the bottom of the phone.</p>`}
     <div class="names">${names.map((n,i)=>`<div class="nm"><div class="av" style="--pc:${PC[i%8]}">${i+1}</div><input id="pn${i}" value="${esc(n)}" maxlength="14" aria-label="Player ${i+1} name">${inGame?"":`<button class="rm" data-rm="${i}" aria-label="Remove player" ${names.length<=2?"disabled":""}>×</button>`}</div>`).join("")}
      ${!inGame&&names.length<8?`<button class="addp" id="addP">+ Add player</button>`:""}</div>
     ${inGame?"":`<div class="lab" style="margin-top:6px"><span>Who starts?</span></div><div class="starter">${names.map((n,i)=>`<button data-st="${i}" aria-pressed="${i===st}" style="--pc:${PC[i%8]}"><span class="av" style="--pc:${PC[i%8]}">${ini(n)}</span>${esc(n)}</button>`).join("")}</div>`}
     <div class="btnrow">${startAfter?`<button class="btn" id="cancel">Cancel</button><button class="btn pri" id="done" style="flex:2">Start game</button>`:`<button class="btn dark" id="done">Done</button>`}</div>`;
    const sync=()=>{const vals=names.map((n,i)=>($$("pn"+i)?.value??n));if(inGame)S.game.players.forEach((p,i)=>p.name=vals[i].trim()||p.name);else S.players=vals;};
    sheetIn.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{sync();S.players.splice(+b.dataset.rm,1);S.starter=0;save();draw();});
    $$("addP")&&($$("addP").onclick=()=>{sync();S.players.push(`Player ${S.players.length+1}`);save();draw();});
    sheetIn.querySelectorAll("input[id^=pn]").forEach((inp,i)=>inp.oninput=()=>{const b=sheetIn.querySelector(`[data-st="${i}"]`);if(b){b.lastChild.textContent=inp.value||`Player ${i+1}`;b.querySelector(".av").textContent=(inp.value.trim()[0]||"?").toUpperCase();}});
    sheetIn.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{sync();S.starter=+b.dataset.st;save();draw();});
    $$("cancel")&&($$("cancel").onclick=closeSheet);
    $$("done").onclick=()=>{sync();save();closeSheet();if(startAfter)startGame();else{render();if(S.table&&!$$("table").hidden)renderTable();}};
  };
  draw();sheet.hidden=false;
}

/* ---------- table mode: seats face their players, clockwise from the bottom ---------- */
const LAYOUT={2:[["bot",0],["top",180]],3:[["bot",0],["left",90],["right",-90]],4:[["bot",0],["left",90],["top",180],["right",-90]]};
function seatHTML(g,i,area,rot,compact){
  const p=g.players[i],N=g.list.length,done=p.phase>=N,ph=done?null:BY[g.list[p.phase]],isS=i===starterOf(g)&&g.winner==null;
  return `<div class="wrap" style="grid-area:${area}"><div class="seat ${isS?"start":""} ${compact?"compact":""}" data-rot="${rot}" style="--pc:${PC[i%8]};--tint:${TINT[i%8]};--rot:${rot}deg">
    <div class="row1"><div class="bign"><small>Phase</small><b>${Math.min(p.phase+1,N)}</b><i>of ${N}</i></div>
      <div class="nm2">${esc(p.name)}${g.winner===i?" ♛":""}<small>${done?"All done!":esc(ph.name)}</small>${done?"":dm(ph.h,!compact)}${isS?`<span class="yt">You start</span>`:""}</div>
      <div class="pts"><b>${p.points}</b><small>pts</small></div></div>
    ${done?"":`${meldsHTML(ph,`P${i}R${g.rounds.length}`)}${ph.nw?`<div><span class="nojoker">${NOJ}No Jokers</span></div>`:""}`}
  </div></div>`;
}
function renderTable(){
  const g=S.game,el=$$("table"),n=g.players.length;
  el.style.cssText="";el.className="table t"+Math.min(n,4);
  const seats=LAYOUT[Math.max(n,2)].map(([area,rot],i)=>seatHTML(g,i,area,rot,n>=3)).join("");
  const ic={x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    u:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
    e:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
  el.innerHTML=seats+`<div class="mid"><button class="rb" id="tExit" aria-label="Close table mode">${ic.x}</button><button class="rb" id="tUndo" aria-label="Undo last round" ${g.rounds.length?"":"disabled"}>${ic.u}</button><button class="rb end" id="tEnd" aria-label="End round" ${g.winner!=null?"disabled":""}>${ic.e}${n===2?"End round":""}</button></div>`;
  el.hidden=false;$$("actions").hidden=true;
  fitSeats();
  $$("tExit").onclick=()=>{S.table=false;save();el.hidden=true;render();};
  $$("tUndo").onclick=()=>{if(!g.rounds.length)return;g.rounds.pop();recompute(g);save();renderTable();toast("Round undone");};
  $$("tEnd").onclick=openRound;
}
function fitSeats(){
  document.querySelectorAll("#table .wrap").forEach(w=>{const s=w.firstElementChild,r=Math.abs(+s.dataset.rot)===90,W=w.clientWidth,H=w.clientHeight;
    s.style.setProperty("--sw",(r?H:W)+"px");s.style.setProperty("--sh",(r?W:H)+"px");});
}
addEventListener("resize",()=>{if(!$$("table").hidden)fitSeats();});

/* ---------- tap a phase part for a quick explanation ---------- */
const PARTS={
 s:k=>({t:`Set of ${k}`,d:`${k} cards with the same number. Colours don't matter.`,ok:["R7","B7","G7","Y7","R7","B7"].slice(0,k),bad:["R7","B7","G8"].concat(k>3?["Y7"]:[]),why:"Numbers must all match"}),
 r:k=>({t:`Run of ${k}`,d:`${k} numbers in a row. Any colours.`,ok:[...Array(k)].map((_,i)=>"RBGY"[i%4]+(3+i)),bad:["R3","B4","G6"],why:"No gaps allowed"}),
 c:k=>({t:`${k} of one colour`,d:"Any numbers, but every card the same colour.",ok:[2,5,5,8,9,11,12,1].slice(0,k).map(n=>"G"+n),bad:["G2","G5","R8"],why:"All cards must be one colour"}),
 R:()=>({t:"Rainbow",d:"The same number once in each of the 4 colours.",ok:["R8","B8","G8","Y8"],bad:["R8","B8","B8","Y8"],why:"Blue twice, green missing"}),
 f:k=>({t:`Colour run of ${k}`,d:"A run where every card is the same colour.",ok:[...Array(k)].map((_,i)=>"B"+(4+i)),bad:["B4","B5","R6"],why:"The colour changed"}),
 z:k=>({t:`Zebra run of ${k}`,d:"A run where two colours take turns.",ok:[...Array(k)].map((_,i)=>(i%2?"B":"R")+(3+i)),bad:["R3","B4","B5"],why:"Same colour twice in a row"}),
 l:k=>({t:`Leap run of ${k}`,d:"Every other number, like 1-3-5 or 2-4-6.",ok:[...Array(k)].map((_,i)=>"RBGY"[i%4]+(1+2*i)),bad:["R2","B3","G4"],why:"Must skip a number each time"}),
 p:k=>({t:`${k} pairs in a row`,d:"Two of each number, numbers in a row.",ok:[...Array(2*k)].map((_,i)=>"RBGY"[i%4]+(6+(i>>1))),bad:["R6","B6","G8","Y8"],why:"The 7s are missing"}),
 b:()=>({t:"Adds to 21",d:"3 cards of one colour that add up to exactly 21.",ok:["Y12","Y5","Y4","=21"],bad:["Y12","Y5","R4"],why:"Colours must match"}),
 x:()=>({t:"4-colour run",d:"A run of 4 where each card is a different colour.",ok:["R3","B4","G5","Y6"],bad:["R3","B4","R5","Y6"],why:"Red used twice"}),
 S:()=>({t:"Skip",d:"You need a real Skip card. A Joker can't replace it. It stays down with your phase.",ok:["S"],bad:["J"],why:"A Joker doesn't count as a Skip"}),
};
function openPart(code,rot,pc){
  const [t,k,nw]=code.split(":"),P=PARTS[t](+k),side=Math.abs(rot)===90;
  const pop=document.createElement("div");pop.className="pop";
  pop.innerHTML=`<div class="pop-in ${side?"side":""}" style="--rot:${rot}deg;--pc:${pc||"var(--blue)"}" role="dialog" aria-label="${P.t}">
    <h3><i></i>${P.t}</h3><p>${P.d}</p>
    <div class="ex"><span class="mk">✓</span><div class="row">${P.ok.map(card).join("")}</div></div>
    <div class="ex bad"><span class="mk">✕</span><div><div class="row">${P.bad.map(card).join("")}</div><small>${P.why}</small></div></div>
    ${t==="S"?"":nw==="1"?`<div class="jnote"><span class="nojoker" style="padding:3px">${NOJ}</span>No Jokers in this phase</div>`:`<div class="jnote">${card("J")}A Joker can fill any spot</div>`}
  </div>`;
  pop.onclick=()=>pop.remove();document.body.appendChild(pop);
}
document.addEventListener("click",e=>{const m=e.target.closest("[data-part]");if(!m)return;const seat=m.closest(".seat");
  openPart(m.dataset.part,seat?+seat.dataset.rot:0,seat?getComputedStyle(seat).getPropertyValue("--pc"):null);});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.part)e.target.click();});

/* ---------- rounds ---------- */
function openRound(){
  const g=S.game,N=g.list.length,draft=g.players.map(()=>({made:false,pts:0}));
  const mini=(cls,t)=>`<div class="c ${cls}"><b><span>${t}</span></b></div>`;
  const draw=()=>{
    sheetIn.innerHTML=`<div class="grab"></div><h2>Round ${g.rounds.length+1} done</h2>
     ${g.players.map((p,i)=>`<div class="rp"><div class="rp-top"><div class="av" style="--pc:${PC[i%8]}">${ini(p.name)}</div><span class="pl-name">${esc(p.name)}</span>
       ${p.phase<N?`<button class="made" data-made="${i}" aria-pressed="${draft[i].made}">${draft[i].made?"✓ Phase made":"Phase made?"}</button>`:""}</div>
       <div class="score-in"><input type="number" inputmode="numeric" min="0" id="pts${i}" value="${draft[i].pts}" aria-label="${esc(p.name)} points">
        <div class="quick"><button data-add="${i}:5">${mini("B","5")}+5</button><button data-add="${i}:10">${mini("R","12")}+10</button><button data-add="${i}:15">${mini("S","S")}+15</button><button data-add="${i}:25">${mini("J","J")}+25</button><button class="clr" data-clr="${i}" aria-label="Reset">0</button></div></div></div>`).join("")}
     <div class="btnrow"><button class="btn" id="cancel">Cancel</button><button class="btn pri" id="saveRound" style="flex:2">Save round</button></div>`;
    sheetIn.querySelectorAll("[data-made]").forEach(b=>b.onclick=()=>{draft[+b.dataset.made].made=!draft[+b.dataset.made].made;draw();});
    sheetIn.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.add.split(":").map(Number);draft[i].pts+=v;$$("pts"+i).value=draft[i].pts;});
    sheetIn.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{const i=+b.dataset.clr;draft[i].pts=0;$$("pts"+i).value=0;});
    g.players.forEach((_,i)=>{const inp=$$("pts"+i);inp.oninput=()=>{draft[i].pts=Math.max(0,parseInt(inp.value)||0);};});
    $$("cancel").onclick=closeSheet;
    $$("saveRound").onclick=()=>{g.rounds.push(draft.map(d=>({...d})));recompute(g);save();closeSheet();S.table&&!$$("table").hidden?renderTable():render();
      toast(g.winner!=null?`${g.players[g.winner].name} wins!`:`${g.players[starterOf(g)].name} starts round ${g.rounds.length+1}`);};
  };
  draw();sheet.hidden=false;
}
function recompute(g){
  const N=g.list.length;g.players.forEach(p=>{p.phase=0;p.points=0;});g.winner=null;
  g.rounds.forEach(r=>g.players.forEach((p,i)=>{p.points+=r[i].pts;if(r[i].made&&p.phase<N)p.phase++;}));
  const fin=g.players.map((p,i)=>({p,i})).filter(x=>x.p.phase>=N).sort((a,b)=>a.p.points-b.p.points);if(fin.length)g.winner=fin[0].i;
}
function openHelp(){
  const ex=(cards,a,b)=>`<div class="gl"><div class="row">${cards.map(card).join("")}</div><div><b>${a}</b><span>${b}</span></div></div>`;
  sheetIn.innerHTML=`<div class="grab"></div><h2>Card guide</h2><p class="note">Tip: tap any part of a phase to see examples.</p><div class="gloss">
   ${ex(["A7"],"Grey card","Any colour")}
   ${ex(["J"],"Joker (J)","Any number, any colour")}
   ${ex(["A5","A5","A5"],"Set","Same number")}
   ${ex(["A3","A4","A5"],"Run","Numbers in a row")}
   ${ex(["R8","B8","G8","Y8"],"Rainbow","One number in all 4 colours")}
   ${ex(["G4","G5","G6"],"Colour run","A run in one colour")}
   ${ex(["R4","B5","R6"],"Zebra run","Two colours take turns")}
   ${ex(["A2","A4","A6"],"Leap run","Every other number")}
   ${ex(["A6","A6","A7","A7"],"Pairs in a row","Two cards of each number")}
   ${ex(["Y12","Y5","Y4"],"Adds to 21","3 cards, one colour, total 21")}
   ${ex(["S"],"Skip","Must be a real Skip. It stays down with the phase")}
   <div class="gl"><span class="nojoker" style="padding:3px">${NOJ}</span><div><b>No Jokers</b><span>No Joker in this phase. Keep one to hit other phases once yours is down, or discard it</span></div></div>
   <div class="gl" style="display:grid;gap:6px"><div><b>Difficulty 0–100</b><span>How many draws you need on average, from 300 simulated deals per phase</span></div>${dm(20)}${dm(55)}${dm(80)}${dm(96)}</div>
  </div>
  <div class="btnrow"><button class="btn dark" id="cancel">Done</button></div>`;
  $$("cancel").onclick=closeSheet;sheet.hidden=false;
}
const sheet=$$("sheet"),sheetIn=$$("sheetIn");
function closeSheet(){sheet.hidden=true;}
sheet.onclick=e=>{if(e.target===sheet)closeSheet();};
let tt;function toast(m){const t=$$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1700);}

render();
if(S.table&&S.game&&S.screen==="game"&&S.game.players.length<=4)renderTable();
</script>
