    <!-- Inlined so the page is dark from the very first paint -- the real
         stylesheet lives in src/styles.css, but it only applies once its
         bundle has been fetched and parsed. Without this, that gap shows
         the browser's default white background, which is especially
         visible when this page is loaded inside another site's iframe.
         #root additionally starts hidden: React mounts (and starts
         painting its raw, browser-default-styled buttons and range
         inputs) before the real stylesheet has necessarily finished
         loading, especially the first cold request in dev. src/styles.css
         un-hides it once it's actually in effect, so nothing unstyled is
         ever visible, regardless of which finishes first. -->
    <style>
      html, body, #root {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        background: #0f1116;
      }

      #root {
        visibility: hidden;
      }
    </style>
    <script type="module" crossorigin src="/projects/motion-platform/assets/index-Dg7cwc-g.js"></script>
    <link rel="stylesheet" crossorigin href="/projects/motion-platform/assets/index-DDWBKFZo.css">
  </head>
